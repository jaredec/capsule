name: Collect daily memes

on:
  schedule:
    # Every 6 hours: keeps a live pick for today and finalizes yesterday after midnight UTC.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Single day to collect (YYYY-MM-DD, 'today' or 'yesterday'). Blank = yesterday + today."
        required: false
      platform:
        description: "Comma-separated platforms"
        required: false
        default: "x"

permissions:
  contents: write

concurrency:
  group: capsule-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL }}
          DATE: ${{ inputs.date }}
          PLATFORM: ${{ inputs.platform || 'x' }}
        run: |
          if [ -n "$DATE" ]; then
            npm run collect -- --date "$DATE" --platform "$PLATFORM" --refresh
          else
            npm run collect -- --platform "$PLATFORM"
          fi
      - run: npm run validate-data
      - name: Commit data
        run: |
          git config user.name "capsule-bot"
          git config user.email "capsule-bot@users.noreply.github.com"
          git add data/days
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: daily collection $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
