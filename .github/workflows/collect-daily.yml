name: Collect daily pulse

on:
  schedule:
    # Twice a day, after Pacific midnight and again in the afternoon PT: coverage of a viral moment trails it, so each run re-settles the last two days.
    - cron: "17 9,21 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Single day to collect (YYYY-MM-DD or 'yesterday'). Blank = the last two complete days."
        required: false

permissions:
  contents: write

concurrency:
  group: capsule-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          DATE: ${{ inputs.date }}
        run: |
          if [ -n "$DATE" ]; then
            npm run collect -- --date "$DATE" --refresh --regather
          else
            npm run collect -- --regather
          fi
      - run: npm run validate-data
      - name: Commit data
        run: |
          git config user.name "capsule-bot"
          git config user.email "capsule-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: pulse $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
