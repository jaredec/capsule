name: Backfill pulse

on:
  workflow_dispatch:
    inputs:
      from:
        description: "First day (YYYY-MM-DD)"
        required: true
      to:
        description: "Last day (YYYY-MM-DD)"
        required: true
      refresh:
        description: "Redo days that already have automated picks"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: capsule-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Backfill
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          REFRESH: ${{ inputs.refresh && '--refresh' || '' }}
        run: npm run collect -- --from "$FROM" --to "$TO" $REFRESH
      - name: Commit data
        # Runs even if the backfill timed out part-way, so finished days aren't lost.
        if: always()
        run: |
          npm run validate-data
          git config user.name "capsule-bot"
          git config user.email "capsule-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: backfill ${{ inputs.from }}..${{ inputs.to }}"
          git pull --rebase
          git push
