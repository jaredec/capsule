name: Backfill memes

on:
  workflow_dispatch:
    inputs:
      from:
        description: "First day (YYYY-MM-DD)"
        required: true
      to:
        description: "Last day (YYYY-MM-DD)"
        required: true
      platform:
        description: "Comma-separated platforms"
        required: false
        default: "x"
      refresh:
        description: "Re-run days that already have automated items"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: capsule-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Backfill
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          PLATFORM: ${{ inputs.platform }}
          REFRESH: ${{ inputs.refresh && '--refresh' || '' }}
        run: npm run collect -- --from "$FROM" --to "$TO" --platform "$PLATFORM" $REFRESH
      - run: npm run validate-data
      - name: Commit data
        run: |
          git config user.name "capsule-bot"
          git config user.email "capsule-bot@users.noreply.github.com"
          git add data/days
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: backfill ${{ inputs.from }}..${{ inputs.to }}"
          git pull --rebase
          git push
